<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API recce</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #12202b; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #ddd; vertical-align: top; }
  input { width: 100%; padding: .4rem; margin: .2rem 0 .8rem; box-sizing: border-box; }
  button { padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer; }
  .PASS { color: #1f7a3d; font-weight: 700; }
  .MAYBE { color: #a35f00; font-weight: 700; }
  .FAIL { color: #b3261e; font-weight: 700; }
  .SKIPPED { color: #666; font-weight: 700; }
</style>
</head>
<body>
  <h1>API recce</h1>
  <p>Checks whether each API works from <em>your browser</em> right now. One pass is not proof of reliability, so run it at different times.</p>

  <label for="geoKey">Geoapify key (optional; stays in this page, never saved)</label>
  <input id="geoKey" type="password" autocomplete="off">

  <label for="customUrl">Any other GET URL that returns JSON (optional)</label>
  <input id="customUrl" type="url" placeholder="https://...">

  <button id="run">Run recce</button>

  <table>
    <thead><tr><th>API</th><th>Verdict</th><th>Why</th><th>Time</th></tr></thead>
    <tbody id="results"></tbody>
  </table>

  <script src="recce.js"></script>
</body>
</html>
